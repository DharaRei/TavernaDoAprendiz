    <!-- Script de Integração  -->
<script>
        async function cadastrarProfessor(event) {
            event.preventDefault();

            const dadosProfessor = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                senha: document.getElementById('senha').value,
                turma: document.getElementById('turma').value,
                materia: document.getElementById('materia').value
            };

            console.log("Enviando dados do professor para o Spring Boot:", dadosProfessor);

            try {
                
                const resposta = await fetch('http://localhost:8081/professores', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(dadosProfessor)
                });

                if (resposta.ok) {
                    const resultado = await resposta.json();
                    console.log("Sucesso:", resultado);
                    alert('✨ Credenciais mágicas salvas com sucesso no banco de dados!');
                    // window.location.href = 'index.html'; // Descomente para redirecionar após o cadastro
                } else {
                    const erroTexto = await resposta.text();
                    console.error("Erro do servidor:", erroTexto);
                    alert('❌ O servidor recusou o registro. Verifique o console.');
                }
            } catch (erro) {
                console.error('Erro de conexão com o Spring Boot:', erro);
                alert('⚠️ Não foi possível conectar ao servidor backend. Verifique se a aplicação Java está rodando na porta 8080.');
            }
        }
