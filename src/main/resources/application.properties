spring.application.name=trilhamagica

# Conexão com banco de dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/trilhamagica
spring.datasource.username=postgres
spring.datasource.password=postgrespassword

# Configurações do JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configurações do Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Porta do Servidor
server.port=8081


# Ativndo o perfil local para encontrar a chave escondida
spring.profiles.active=local

# Chave Genérica da IA
ai.api.key=${AI_API_KEY}

#Conexão com a Azure
azure.storage.connection-string=DefaultEndpointsProtocol=https;AccountName=Dhara.reisilva@outlook.com;AccountKey=Anime@28;EndpointSuffix=core.windows.net
azure.storage.container-name=trilha-magica-files

