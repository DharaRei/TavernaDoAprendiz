name: CD - Trilha Mágica Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Autenticar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir e Enviar Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: seu-usuario-docker/trilhamagica-backend:latest

  deploy-production:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sua-api-na-nuvem.com
    steps:
      - name: Disparar Webhook de Deploy para a Nuvem
        run: |
          echo "Imagem enviada com sucesso! Aguardando aprovação manual no ambiente de produção..."
          # Aqui entraria a chamada para o webhook do serviço de nuvem (ex: Render ou Portainer)