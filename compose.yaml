version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: trilhamagica_db
    environment:
      POSTGRES_DB: trilhamagica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: